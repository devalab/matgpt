[project]
name = "matgpt"
version = "0.1.0"
description = "Transformer-based generation of inorganic materials with targeted properties"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "MIT" }
authors = [
  { name = "Harsha Satya Vardhan Vasamsetti" },
  { name = "Pradeep Kumar Pal" },
  { name = "Masahiro Ehara" },
  { name = "U. Deva Priyakumar" },
]
keywords = [
  "materials-informatics",
  "generative-models",
  "crystal-structures",
  "transformers",
  "SLICES",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Repository = "https://github.com/devalab/matgpt"
